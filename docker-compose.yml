services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: discord-music-lavalink
    restart: unless-stopped
    ports:
      - "127.0.0.1:2333:2333"
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
    environment:
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:?Set LAVALINK_PASSWORD in your .env file}
      _JAVA_OPTIONS: -Xmx1G
