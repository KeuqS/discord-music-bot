services:
  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher:master
    container_name: beatwave-yt-cipher
    restart: unless-stopped
    environment:
      OVERRIDE_PLAYER_VARIANT: IAS
    expose:
      - "8001"

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: discord-music-lavalink
    restart: unless-stopped
    depends_on:
      - yt-cipher
    ports:
      - "127.0.0.1:2333:2333"
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
    environment:
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:?Set LAVALINK_PASSWORD in your .env file}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      _JAVA_OPTIONS: -Xmx1G
